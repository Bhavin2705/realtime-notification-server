<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Notification Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.connected .dot {
      box-shadow: 0 0 8px currentColor;
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input, select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-connect { background: var(--success); color: #fff; }
    .btn-connect:hover { filter: brightness(1.1); }

    .btn-disconnect { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-disconnect:hover { background: rgba(239, 68, 68, 0.25); }

    .btn-secondary { background: rgba(148, 163, 184, 0.1); color: var(--text); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }

    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .presets {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .badge-count {
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 6px;
    }

    #notifications {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #notifications:empty::after {
      content: "No notifications received yet. Connect and send a payload to test live delivery.";
      display: block;
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px dashed var(--card-border);
      border-radius: 10px;
    }

    .notification-item {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 14px 16px;
      animation: slideIn 0.25s ease-out forwards;
      position: relative;
    }

    .notification-item.type-ORDER_SHIPPED { border-left-color: #3b82f6; }
    .notification-item.type-SYSTEM_ALERT { border-left-color: #f59e0b; }
    .notification-item.type-SECURITY_NOTICE { border-left-color: #ef4444; }
    .notification-item.type-MENTION { border-left-color: #10b981; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .notification-item .type {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--primary);
      text-transform: uppercase;
    }

    .notification-item.type-SYSTEM_ALERT .type { color: #f59e0b; }
    .notification-item.type-SECURITY_NOTICE .type { color: #ef4444; }
    .notification-item.type-MENTION .type { color: #10b981; }

    .notification-item .time {
      font-size: 11px;
      color: var(--text-muted);
    }

    .notification-item .title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .notification-item .body {
      font-size: 13px;
      color: #cbd5e1;
    }

    .item-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    .quick-gen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🔔</div>
        <div>
          <h1>Notification Demo</h1>
          <div class="subtitle">Real-Time Event Dispatcher (Node.js + Socket.io + Redis)</div>
        </div>
      </div>
      <div id="status" class="status-badge status disconnected">
        <span class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <div class="grid">
      <!-- Left Column: Controls -->
      <div>
        <!-- Connection Card -->
        <div class="card">
          <div class="card-title">
            <span>1. Authentication</span>
          </div>
          <div class="form-group">
            <label for="tokenInput">Bearer JWT Token</label>
            <input type="text" id="tokenInput" placeholder="Paste token or click Generate below">
            <div class="quick-gen">
              <span style="font-size: 11px; color: var(--text-muted);">User: <strong style="color: var(--text);">usr_1</strong></span>
              <button type="button" class="btn-secondary btn-sm" onclick="generateDemoToken()">Generate Token</button>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn-connect" onclick="connect()">Connect Socket</button>
            <button class="btn-disconnect" onclick="disconnect()">Disconnect</button>
          </div>
        </div>

        <!-- Dispatch Card -->
        <div class="card">
          <div class="card-title">
            <span>2. Send Notification</span>
          </div>
          
          <label>Presets</label>
          <div class="presets">
            <button type="button" class="btn-secondary btn-sm" onclick="setPreset('ORDER_SHIPPED', 'Order Shipped!', 'Your package #8821 has been handed to the carrier.')">📦 Order</button>
            <button type="button" class="btn-secondary btn-sm" onclick="setPreset('SYSTEM_ALERT', 'System Alert', 'Database backup completed successfully.')">⚡ Alert</button>
            <button type="button" class="btn-secondary btn-sm" onclick="setPreset('SECURITY_NOTICE', 'Security Notice', 'Login detected from a new browser.')">🛡️ Security</button>
          </div>

          <div class="form-group">
            <label for="userId">Target User ID</label>
            <input type="text" id="userId" value="usr_1" placeholder="Target User ID">
          </div>

          <div class="form-group">
            <label for="notifType">Type</label>
            <select id="notifType">
              <option value="ORDER_SHIPPED">ORDER_SHIPPED</option>
              <option value="SYSTEM_ALERT">SYSTEM_ALERT</option>
              <option value="SECURITY_NOTICE">SECURITY_NOTICE</option>
              <option value="MENTION">MENTION</option>
            </select>
          </div>

          <div class="form-group">
            <label for="notifTitle">Title</label>
            <input type="text" id="notifTitle" value="Order Shipped!" placeholder="Title">
          </div>

          <div class="form-group">
            <label for="notifBody">Body</label>
            <textarea id="notifBody" rows="2" placeholder="Notification body...">Your package #8821 has been handed to the carrier.</textarea>
          </div>

          <button class="btn-primary btn-send" style="width: 100%;" onclick="sendNotification()">
            <span>Dispatch Event</span>
          </button>
        </div>
      </div>

      <!-- Right Column: Live Feed -->
      <div>
        <div class="card">
          <div class="feed-header">
            <div style="font-weight: 600; font-size: 15px;">
              Live Activity Stream <span id="badge" class="badge-count">0</span>
            </div>
            <div class="btn-group">
              <button class="btn-secondary btn-sm" onclick="fetchUnreadREST()">Fetch Unread (REST)</button>
              <button class="btn-secondary btn-sm" onclick="markAllReadREST()">Mark All Read</button>
            </div>
          </div>

          <div id="notifications"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null;
    let count = 0;

    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('statusText');
    const badgeEl = document.getElementById('badge');
    const notifContainer = document.getElementById('notifications');

    function updateBadge(newCount) {
      count = newCount;
      badgeEl.textContent = count ? '(' + count + ')' : '';
    }

    function generateDemoToken() {
      // client-side JWT helper for quick testing (header.payload.sig)
      const header = btoa(JSON.stringify({ alg: "HS256", typ: "JWT" }));
      const payload = btoa(JSON.stringify({ user_id: "usr_1", iat: Math.floor(Date.now() / 1000) }));
      const mockSig = "demo-signature";
      const token = `${header}.${payload}.${mockSig}`;
      document.getElementById('tokenInput').value = token;
    }

    function setPreset(type, title, body) {
      document.getElementById('notifType').value = type;
      document.getElementById('notifTitle').value = title;
      document.getElementById('notifBody').value = body;
    }

    function connect() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('Please enter or generate a JWT token first.');

      if (socket) socket.disconnect();

      socket = io(window.location.origin, { auth: { token } });

      socket.on('connect', () => {
        statusEl.className = 'status-badge connected status';
        statusTextEl.textContent = 'Connected';
      });

      socket.on('notification:new', (data) => {
        updateBadge(count + 1);
        renderNotificationItem(data);
        socket.emit('notification:ack', { id: data.id });
      });

      socket.on('disconnect', () => {
        statusEl.className = 'status-badge disconnected status';
        statusTextEl.textContent = 'Disconnected';
      });

      socket.on('connect_error', (err) => {
        alert('Connection error: ' + err.message);
        statusEl.className = 'status-badge disconnected status';
        statusTextEl.textContent = 'Disconnected';
      });
    }

    function disconnect() {
      if (socket) socket.disconnect();
    }

    function renderNotificationItem(data) {
      const item = document.createElement('div');
      item.className = `notification-item type-${data.type}`;
      item.id = `item-${data.id}`;
      
      const timeStr = data.created_at ? new Date(data.created_at).toLocaleTimeString() : new Date().toLocaleTimeString();

      item.innerHTML = `
        <div class="item-header">
          <span class="type">${data.type}</span>
          <span class="time">${timeStr}</span>
        </div>
        <div class="title">${escapeHtml(data.title)}</div>
        <div class="body">${escapeHtml(data.body)}</div>
        <div class="item-actions">
          <button class="btn-secondary btn-sm" onclick="markSingleRead('${data.id}')">Mark Read</button>
        </div>
      `;

      notifContainer.prepend(item);
    }

    async function sendNotification() {
      const token = document.getElementById('tokenInput').value.trim();
      const userId = document.getElementById('userId').value.trim();
      const type = document.getElementById('notifType').value;
      const title = document.getElementById('notifTitle').value.trim();
      const body = document.getElementById('notifBody').value.trim();

      if (!token || !userId || !title || !body) {
        return alert('Please fill in all fields before sending.');
      }

      try {
        const res = await fetch('/api/v1/notifications/send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify({
            user_id: userId,
            type: type,
            title: title,
            body: body,
            data: { sent_via: 'web_dashboard' },
          }),
        });

        const result = await res.json();
        if (!result.success) {
          alert('Failed to send notification: ' + result.message);
        }
      } catch (err) {
        alert('Network error sending notification.');
      }
    }

    async function fetchUnreadREST() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('Please enter or generate a JWT token first.');

      try {
        const res = await fetch('/api/v1/notifications/unread?page=1&limit=20', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const result = await res.json();
        if (result.success) {
          notifContainer.innerHTML = '';
          updateBadge(result.unread_count);
          result.data.forEach(item => renderNotificationItem(item));
        } else {
          alert('Error: ' + result.message);
        }
      } catch (err) {
        alert('Failed to fetch unread notifications.');
      }
    }

    async function markSingleRead(id) {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('Please enter or generate a JWT token first.');

      try {
        const res = await fetch(`/api/v1/notifications/${id}/read`, {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const result = await res.json();
        if (result.success) {
          const el = document.getElementById(`item-${id}`);
          if (el) el.remove();
          updateBadge(Math.max(0, count - 1));
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function markAllReadREST() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) return alert('Please enter or generate a JWT token first.');

      try {
        const res = await fetch('/api/v1/notifications/read-all', {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const result = await res.json();
        if (result.success) {
          notifContainer.innerHTML = '';
          updateBadge(0);
        }
      } catch (err) {
        alert('Failed to mark all as read.');
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initialize with a default demo token on load
    generateDemoToken();
  </script>
</body>
</html>
