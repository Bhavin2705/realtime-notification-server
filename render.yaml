services:
  - type: web
    name: realtime-notification-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: notification-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: notification-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true

databases:
  - name: notification-db
    databaseName: notification_db
    user: postgres
    plan: free

  - name: notification-redis
    type: redis
    plan: free
